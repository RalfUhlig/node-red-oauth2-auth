name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / Node-RED ${{ matrix.node-red }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 20, node-red: "3.1" }
          - { node: 20, node-red: "4" }
          - { node: 22, node-red: "4" }
          - { node: 24, node-red: "4" }
          - { node: 22, node-red: "5" }
          - { node: 24, node-red: "5" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Node-RED ${{ matrix.node-red }}
        run: npm install --no-save "node-red@${{ matrix.node-red }}"
      - run: npm test

  scorecard:
    name: Node-RED scorecard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes node-red-dev validate
